[project]
name = "renda-worker"
version = "0.1.0"
description = "Renda render worker on Modal"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "modal>=1.0.4,<2",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "requests>=2.32",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
