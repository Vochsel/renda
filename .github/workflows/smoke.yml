name: Production smoke

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL
        default: https://renda.vochsel.com

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    # Never on forks: it spends real render time against production with the repo's key.
    if: github.repository == 'vochsel/renda'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDA_API_URL: ${{ inputs.api_url || 'https://renda.vochsel.com' }}
      RENDA_API_KEY: ${{ secrets.RENDA_CI_API_KEY }}
    steps:
      - name: Require RENDA_CI_API_KEY
        run: |
          if [ -z "$RENDA_API_KEY" ]; then
            echo "::error::Set the RENDA_CI_API_KEY repository secret (an API key for a dedicated CI org)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@rendahq/cli..."
      - run: pnpm --filter "@rendahq/cli..." build
      - name: Smoke test production
        run: node .github/scripts/smoke.mjs
      # Fail loudly: open (or comment on) an issue when the scheduled run breaks.
      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production smoke test failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The nightly smoke test against production failed: $RUN_URL"
          fi
