[project]
name = "renda"
version = "0.1.0"
description = "Lightweight render CLI + scene IR wrapping Blender, Mitsuba, three.js and more. Local or in the Renda cloud."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "zstandard>=0.22",
  "pydantic>=2.7",
  "numpy>=1.26",
  "trimesh>=4.4",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
  "lxml>=5",
  "pycollada>=0.8",
  "networkx>=3",
]

[project.optional-dependencies]
mitsuba = ["mitsuba>=3.5", "drjit>=0.4.6"]
usd = ["usd-core>=24.5"]
blender = ["bpy>=4.2"]
threejs = ["playwright>=1.45"]
all = ["renda[mitsuba,usd,threejs]"]

[project.scripts]
renda = "renda.cli:app"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
